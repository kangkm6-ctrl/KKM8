<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>명함 스캐너</title>

<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#0d1f45" />

<!-- iOS 홈 화면 추가용 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="명함스캐너" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" href="./icon-192.png" />

<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: linear-gradient(155deg, #0a1a3a 0%, #123a5e 45%, #1f8298 100%);
    background-attachment: fixed;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom));
  }
</style>
</head>
<body>

<div id="card-scanner-root"></div>
<style>
  #card-scanner-root {
    --navy-deep: #0a1a3a;
    --navy: #123a5e;
    --teal: #1f8298;
    --cyan: #4fd8e0;
    --herb: #3bc48a;
    --ink: #10233c;
    --ink-soft: #5c7285;
    --line: #d7e3e8;
    --panel: rgba(255,255,255,0.96);
    --danger: #d1483c;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    color: var(--ink);
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  #card-scanner-root * { box-sizing: border-box; }
  #card-scanner-root .panel {
    background: var(--panel);
    border-radius: 22px;
    padding: 22px 18px 26px;
    box-shadow: 0 18px 40px rgba(6,20,45,0.35);
    backdrop-filter: blur(6px);
  }
  #card-scanner-root .eyebrow-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 14px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  #card-scanner-root .logo-badge {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: linear-gradient(155deg, var(--navy-deep), var(--teal));
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #card-scanner-root .logo-badge svg { width: 22px; height: 22px; }
  #card-scanner-root .title-block { flex: 1; }
  #card-scanner-root h1 {
    font-size: 18px;
    margin: 0;
    letter-spacing: -0.2px;
    font-weight: 700;
    color: var(--ink);
  }
  #card-scanner-root .stamp-tag {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--teal);
    background: rgba(31,130,152,0.1);
    padding: 2px 8px;
    border-radius: 20px;
    margin-top: 3px;
  }
  #card-scanner-root .stage { display: none; }
  #card-scanner-root .stage.active { display: block; }
  #card-scanner-root .scan-frame { position: relative; }
  #card-scanner-root .dropzone {
    position: relative;
    border-radius: 16px;
    padding: 34px 16px;
    text-align: center;
    background: linear-gradient(160deg, rgba(18,58,94,0.06), rgba(31,130,152,0.1));
    cursor: pointer;
    display: block;
    overflow: hidden;
  }
  #card-scanner-root .dropzone .corner {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 0 solid var(--cyan);
  }
  #card-scanner-root .dropzone .corner.tl { top: 10px; left: 10px; border-top-width: 3px; border-left-width: 3px; border-radius: 6px 0 0 0; }
  #card-scanner-root .dropzone .corner.tr { top: 10px; right: 10px; border-top-width: 3px; border-right-width: 3px; border-radius: 0 6px 0 0; }
  #card-scanner-root .dropzone .corner.bl { bottom: 10px; left: 10px; border-bottom-width: 3px; border-left-width: 3px; border-radius: 0 0 0 6px; }
  #card-scanner-root .dropzone .corner.br { bottom: 10px; right: 10px; border-bottom-width: 3px; border-right-width: 3px; border-radius: 0 0 6px 0; }
  #card-scanner-root .dropzone .cam-icon { font-size: 104px; margin-bottom: 14px; }
  #card-scanner-root .dropzone p.lead { font-size: 15px; margin: 0 0 4px; font-weight: 600; color: var(--ink); }
  #card-scanner-root .dropzone p.sub {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0;
  }
  #card-scanner-root input[type=file] { display: none; }
  #card-scanner-root .preview-wrap {
    margin-top: 16px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  #card-scanner-root .preview-wrap img { width: 100%; display: block; }
  #card-scanner-root .primary-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--navy), var(--teal));
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 700;
    margin-top: 14px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(18,58,94,0.28);
  }
  #card-scanner-root .primary-btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
  #card-scanner-root .ghost-btn {
    width: 100%;
    background: transparent;
    color: var(--teal);
    border: 1.5px solid rgba(31,130,152,0.35);
    border-radius: 12px;
    padding: 11px;
    font-size: 13.5px;
    font-weight: 600;
    margin-top: 10px;
    cursor: pointer;
  }
  #card-scanner-root .loading { text-align: center; padding: 34px 10px; }
  #card-scanner-root .loading .spinner {
    width: 30px; height: 30px;
    border: 3px solid var(--line);
    border-top-color: var(--teal);
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: cs-spin 0.8s linear infinite;
  }
  @keyframes cs-spin { to { transform: rotate(360deg); } }
  #card-scanner-root .loading p {
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  #card-scanner-root .field-group { margin-bottom: 12px; }
  #card-scanner-root .field-group label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--teal);
    margin-bottom: 4px;
  }
  #card-scanner-root .field-group input {
    width: 100%;
    padding: 11px 12px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-family: inherit;
    font-size: 14.5px;
    background: #fff;
    color: var(--ink);
  }
  #card-scanner-root .field-group input:focus { outline: none; border-color: var(--teal); }
  #card-scanner-root .multi-row { display: flex; gap: 8px; margin-bottom: 8px; }
  #card-scanner-root .multi-row input { flex: 1; }
  #card-scanner-root .multi-row button {
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    color: var(--danger);
    font-size: 15px;
    width: 38px;
    cursor: pointer;
  }
  #card-scanner-root .add-line {
    background: none;
    border: none;
    color: var(--teal);
    font-size: 12.5px;
    font-weight: 700;
    padding: 4px 0 10px;
    cursor: pointer;
  }
  #card-scanner-root .divider { border: none; border-top: 1px dashed var(--line); margin: 18px 0; }
  #card-scanner-root .error-box {
    background: rgba(209,72,60,0.08);
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 10px;
    margin-top: 12px;
  }
  #card-scanner-root .done-box { text-align: center; padding: 22px 10px 6px; }
  #card-scanner-root .done-box .mark {
    font-size: 30px;
    width: 56px;
    height: 56px;
    line-height: 56px;
    margin: 0 auto 10px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--herb), var(--teal));
    color: #fff;
  }
  #card-scanner-root .done-box p { font-size: 14px; color: var(--ink-soft); margin: 4px 0 0; }
  #card-scanner-root .done-box p:first-of-type { font-size: 16px; font-weight: 700; color: var(--ink); }
  #card-scanner-root .field-hint {
    font-size: 11px;
    color: var(--ink-soft);
    margin: -4px 0 14px;
  }
</style>
<script>
(function () {
  const root = document.getElementById('card-scanner-root');

  // ▼▼▼ Render에 프록시 서버 배포 후 이 두 값을 반드시 바꿔주세요 ▼▼▼
  const PROXY_URL = 'https://kkm8.onrender.com/scan-card';
  const APP_SECRET = 'myeongham2026';
  // ▲▲▲ 서버의 APP_SECRET 환경변수와 반드시 동일해야 합니다 ▲▲▲

  root.innerHTML = `
  <div class="panel">
    <div class="eyebrow-row">
      <div class="logo-badge">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 13c-1.5-3 0-6 2-7" stroke="#8CF3E8" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M27 13c1.5-3 0-6-2-7" stroke="#8CF3E8" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="20" cy="17" r="6.5" stroke="#ffffff" stroke-width="2.2"/>
          <path d="M11 33c1-7 5-11 9-11s8 4 9 11" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M20 25c-2.5 2-3 5-2 8" stroke="#3bc48a" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M20 25c2.5 1.4 3.4 4 3 7" stroke="#3bc48a" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="title-block">
        <h1>명함 스캐너</h1>
        <span class="stamp-tag">AI 명함 인식 · 신농 에디션</span>
      </div>
    </div>

    <div class="stage active" data-stage="upload">
      <label class="dropzone" id="cs-dropzone">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
        <div class="cam-icon">🪪</div>
        <p class="lead">앨범에서 명함 사진 선택</p>
        <p class="sub">사진 보관함에서 선택</p>
        <input type="file" id="cs-file-input-album" accept="image/*" />
      </label>
      <button type="button" class="ghost-btn" id="cs-camera-btn">📷 카메라로 바로 촬영</button>
      <input type="file" id="cs-file-input-camera" accept="image/*" capture="environment" style="display:none" />
      <div id="cs-preview-area"></div>
    </div>

    <div class="stage" data-stage="loading">
      <div class="loading">
        <div class="spinner"></div>
        <p>명함 글자를 읽는 중...</p>
      </div>
    </div>

    <div class="stage" data-stage="form">
      <form id="cs-form"></form>
    </div>

    <div class="stage" data-stage="done">
      <div class="done-box">
        <div class="mark">✓</div>
        <p id="cs-done-name"></p>
        <p>연락처 미리보기가 열리면 오른쪽 위 "추가"를 눌러 저장하세요.</p>
      </div>
      <button class="primary-btn" id="cs-restart-btn" type="button">다른 명함 스캔하기</button>
    </div>
  </div>
  `;

  const stages = {};
  root.querySelectorAll('.stage').forEach(s => { stages[s.dataset.stage] = s; });
  function showStage(name) {
    Object.values(stages).forEach(s => s.classList.remove('active'));
    stages[name].classList.add('active');
  }

  const fileInputAlbum = root.querySelector('#cs-file-input-album');
  const fileInputCamera = root.querySelector('#cs-file-input-camera');
  const previewArea = root.querySelector('#cs-preview-area');
  let imageBase64 = null;
  let imageMediaType = null;

  function handleFileChange(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX_DIM = 1280;
        let { width, height } = img;
        if (width > MAX_DIM || height > MAX_DIM) {
          const scale = MAX_DIM / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.82);

        imageMediaType = 'image/jpeg';
        imageBase64 = resizedDataUrl.split(',')[1];

        previewArea.innerHTML = `
          <div class="preview-wrap"><img src="${resizedDataUrl}" /></div>
          <button class="primary-btn" id="cs-scan-btn" type="button">명함 읽기</button>
        `;
        root.querySelector('#cs-scan-btn').addEventListener('click', runScan);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  fileInputAlbum.addEventListener('change', handleFileChange);
  fileInputCamera.addEventListener('change', handleFileChange);
  root.querySelector('#cs-camera-btn').addEventListener('click', () => fileInputCamera.click());

  async function runScan() {
    showStage('loading');
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 45000); // 45초 넘으면 포기하고 에러 표시
    try {
      const response = await fetch(PROXY_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-app-secret': APP_SECRET
        },
        body: JSON.stringify({
          imageBase64: imageBase64,
          mediaType: imageMediaType
        }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      const parsed = await response.json();
      if (parsed.error) throw new Error(parsed.error);
      renderForm(parsed);
      showStage('form');
    } catch (err) {
      clearTimeout(timeoutId);
      showStage('upload');
      const msg = err.name === 'AbortError'
        ? '서버 응답이 45초 넘게 없어 중단했습니다. 서버가 깨어나는 중일 수 있으니 잠시 후 다시 시도해 주세요.'
        : err.message;
      previewArea.insertAdjacentHTML('beforeend', `<div class="error-box">읽기에 실패했습니다: ${escapeHtml(msg)}. 다시 시도해 주세요.</div>`);
    }
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.innerText = s;
    return d.innerHTML;
  }

  function renderForm(data) {
    const form = root.querySelector('#cs-form');
    const phones = (data.phones && data.phones.length) ? data.phones : [{ label: '휴대전화', number: '' }];
    const emails = (data.emails && data.emails.length) ? data.emails : [''];

    form.innerHTML = `
      <div class="field-group">
        <label>이름</label>
        <input type="text" name="name" value="${escapeHtml(data.name || '')}" />
      </div>
      <div class="field-group">
        <label>회사</label>
        <input type="text" name="company" value="${escapeHtml(data.company || '')}" />
      </div>
      <div class="field-group">
        <label>직함</label>
        <input type="text" name="title" value="${escapeHtml(data.title || '')}" />
      </div>

      <hr class="divider" />

      <label style="display:block;font-size:11px;font-weight:700;color:var(--teal);margin-bottom:6px;">전화번호</label>
      <div id="cs-phones"></div>
      <button type="button" class="add-line" id="cs-add-phone">+ 전화번호 추가</button>

      <label style="display:block;font-size:11px;font-weight:700;color:var(--teal);margin-bottom:6px;">이메일</label>
      <div id="cs-emails"></div>
      <button type="button" class="add-line" id="cs-add-email">+ 이메일 추가</button>

      <hr class="divider" />

      <div class="field-group">
        <label>주소</label>
        <input type="text" name="address" value="${escapeHtml(data.address || '')}" />
      </div>
      <div class="field-group">
        <label>웹사이트</label>
        <input type="text" name="website" value="${escapeHtml(data.website || '')}" />
      </div>

      <p class="field-hint">읽은 내용이 틀리면 직접 수정한 뒤 저장하세요.</p>
      <button type="submit" class="primary-btn">연락처에 저장하기</button>
      <button type="button" class="ghost-btn" id="cs-back-btn">뒤로</button>
    `;

    const phonesWrap = form.querySelector('#cs-phones');
    const emailsWrap = form.querySelector('#cs-emails');

    function addPhoneRow(label, number) {
      const row = document.createElement('div');
      row.className = 'multi-row';
      row.innerHTML = `
        <input type="text" class="phone-label" placeholder="구분 (예: 휴대전화)" value="${escapeHtml(label || '')}" style="flex:0.8" />
        <input type="tel" class="phone-number" placeholder="번호" value="${escapeHtml(number || '')}" />
        <button type="button" class="remove-row">×</button>
      `;
      row.querySelector('.remove-row').addEventListener('click', () => row.remove());
      phonesWrap.appendChild(row);
    }
    function addEmailRow(value) {
      const row = document.createElement('div');
      row.className = 'multi-row';
      row.innerHTML = `
        <input type="email" class="email-value" placeholder="email@example.com" value="${escapeHtml(value || '')}" />
        <button type="button" class="remove-row">×</button>
      `;
      row.querySelector('.remove-row').addEventListener('click', () => row.remove());
      emailsWrap.appendChild(row);
    }

    phones.forEach(p => addPhoneRow(p.label, p.number));
    emails.forEach(e => addEmailRow(e));

    form.querySelector('#cs-add-phone').addEventListener('click', () => addPhoneRow('', ''));
    form.querySelector('#cs-add-email').addEventListener('click', () => addEmailRow(''));
    form.querySelector('#cs-back-btn').addEventListener('click', () => showStage('upload'));

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const name = fd.get('name') || '연락처';
      const company = fd.get('company') || '';
      const title = fd.get('title') || '';
      const address = fd.get('address') || '';
      const website = fd.get('website') || '';

      const phoneRows = Array.from(phonesWrap.querySelectorAll('.multi-row')).map(r => ({
        label: r.querySelector('.phone-label').value,
        number: r.querySelector('.phone-number').value
      })).filter(p => p.number.trim());

      const emailRows = Array.from(emailsWrap.querySelectorAll('.multi-row')).map(r => r.querySelector('.email-value').value)
        .filter(v => v.trim());

      const vcard = buildVCard({ name, company, title, address, website, phones: phoneRows, emails: emailRows });
      downloadVCard(vcard, name);

      root.querySelector('#cs-done-name').textContent = name;
      showStage('done');
    });
  }

  function typeForLabel(label) {
    if (!label) return 'CELL';
    if (label.includes('휴대') || /mobile|cell/i.test(label)) return 'CELL';
    if (label.includes('팩스') || /fax/i.test(label)) return 'FAX';
    if (label.includes('회사') || label.includes('사무') || /work|office/i.test(label)) return 'WORK';
    return 'CELL';
  }

  function vEsc(s) {
    return String(s || '')
      .replace(/\\/g, '\\\\')
      .replace(/\n/g, '\\n')
      .replace(/,/g, '\\,')
      .replace(/;/g, '\\;');
  }

  function buildVCard({ name, company, title, address, website, phones, emails }) {
    const lines = ['BEGIN:VCARD', 'VERSION:3.0'];
    const safeName = vEsc(name);
    lines.push(`N:;${safeName};;;`);
    lines.push(`FN:${safeName}`);
    if (company) lines.push(`ORG:${vEsc(company)}`);
    if (title) lines.push(`TITLE:${vEsc(title)}`);
    phones.forEach(p => { lines.push(`TEL;TYPE=${typeForLabel(p.label)}:${p.number.replace(/[^\d+#*]/g, m => m)}`); });
    emails.forEach(e => { lines.push(`EMAIL;TYPE=INTERNET:${e.trim()}`); });
    if (address) lines.push(`ADR;TYPE=WORK:;;${vEsc(address)};;;;`);
    if (website) lines.push(`URL:${website.trim()}`);
    lines.push('END:VCARD');
    return lines.join('\r\n');
  }

  function downloadVCard(vcardText, name) {
    const blob = new Blob([vcardText], { type: 'text/vcard' });
    const url = URL.createObjectURL(blob);
    // 새 창을 열지 않고, 현재 화면에서 바로 이동시켜 연락처 미리보기를 띄웁니다.
    // (홈 화면에 설치된 앱 모드에서는 새 창 열기가 느리거나 막힐 수 있어 이 방식이 더 안정적입니다)
    window.location.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 15000);
  }

  root.querySelector('#cs-restart-btn').addEventListener('click', () => {
    imageBase64 = null;
    previewArea.innerHTML = '';
    fileInputAlbum.value = '';
    fileInputCamera.value = '';
    showStage('upload');
  });
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
